name: Instagram Guncelleme

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaloader ve Session Hazirla
        env:
          USER: ${{ secrets.INSTA_USER }}
          SESSIONID: ${{ secrets.INSTA_SESSIONID }}
        run: |
          pip install instaloader
          # Oturum dosyasini manuel olusturuyoruz (Sifre gerektirmez)
          python -c "
          import os
          from instaloader import InstaloaderContext
          ctx = InstaloaderContext()
          ctx.username = '$USER'
          ctx._session.cookies.set('sessionid', '$SESSIONID', domain='.instagram.com')
          ctx.save_session_to_file(os.path.expanduser(f'~/.config/instaloader/session-$USER'))
          "

      - name: Resimleri Cek
        run: |
          # Artik giris yapilmis durumda, sadece cekiyoruz
          instaloader --no-videos --no-metadata-json --no-captions --no-compress-json --count 9 dostekkoleji
          
      - name: Degisiklikleri Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Instagram Akışı Güncellendi" || echo "No changes"
          git push
